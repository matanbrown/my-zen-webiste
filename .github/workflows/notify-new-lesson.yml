name: Notify new lesson

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lesson_slug:
        description: "Optional: force-send notification for this lesson slug (e.g. 2026-08-03-the-question-that-stayed), bypassing auto-detection. Leave empty for normal auto-detect behavior."
        required: false
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit too, to compare draft state

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/notify-new-lesson.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LESSON_SLUG: ${{ github.event.inputs.lesson_slug }}
