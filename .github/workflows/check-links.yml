name: Check links

on:
  schedule:
    # Weekly, Monday mornings.
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/check-links.mjs
